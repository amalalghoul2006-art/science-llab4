<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مختبر الفصل المطور 🔬</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #cfd8dc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .lab-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; width: 550px; border: 5px solid #5d4037; }
        
        /* صندوق الرمل */
        .sand-box { 
            position: relative; height: 220px; width: 100%; margin: 15px 0; 
            background: #e1c699; 
            background-image: radial-gradient(#c2a679 10%, transparent 20%);
            background-size: 6px 6px;
            border-radius: 15px; border: 4px solid #8d6e63; overflow: hidden; cursor: crosshair;
        }
        
        .magnet { 
            font-size: 60px; position: absolute; z-index: 1000; 
            pointer-events: none; transform: translate(-50%, -50%); 
            line-height: 1; 
        }

        .iron { 
            position: absolute; width: 12px; height: 12px; background: #000; 
            border-radius: 50%; z-index: 10; pointer-events: none;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

        .food-area { position: relative; height: 180px; width: 100%; margin: 15px 0; background: #fff; border-radius: 15px; border: 2px dashed #ff9800; overflow: hidden; }
        .item { position: absolute; font-size: 35px; cursor: pointer; transition: 0.3s; user-select: none; }

        button { padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 15px; border: none; color: white; font-weight: bold; margin: 5px; }
        .btn-audio { background: #e91e63; width: 100%; }
        .btn-reset { background: #f44336; }
        #status { font-weight: bold; color: #3e2723; background: #f5f5f5; padding: 10px; border-radius: 10px; margin-top: 10px; min-height: 40px; }
    </style>
</head>
<body>

<div class="lab-card">
    <h1>🔬 مختبر فصل المواد الصلبة</h1>
    <button class="btn-audio" onclick="initAudio()">🔊 اضغطي هنا لتفعيل الصوت</button>

    <p>1. مرري المغناطيس 🧲 فوق الرمل لجذب كل الحديد:</p>
    <div class="sand-box" id="sandArea" onmousemove="catchIron(event)">
        <div id="magnet" class="magnet" style="left: 50%; top: 20px;">🧲</div>
    </div>

    <hr>
    <p>2. انقري على الفاصوليا 🫘 لفصلها:</p>
    <div class="food-area" id="foodBox"></div>

    <button class="btn-reset" onclick="resetLab()">🔄 إعادة التجربة</button>
    <div id="status">جاهزة؟ فعلي الصوت وابدأي الفصل!</div>
</div>

<script>
    let audioCtx;
    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        beep(440, 0.2);
        document.getElementById('status').innerText = "تم تفعيل الصوت! ✅ ابدأي السحب.";
    }

    function beep(freq, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq; osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }

    function createItems() {
        const area = document.getElementById('sandArea');
        document.querySelectorAll('.iron').forEach(i => i.remove());
        for(let i=0; i<20; i++) {
            let bit = document.createElement('div');
            bit.className = 'iron';
            bit.dataset.caught = "false";
            bit.style.left = (Math.random() * 90 + 5) + "%";
            bit.style.top = (Math.random() * 70 + 20) + "%";
            area.appendChild(bit);
        }

        const box = document.getElementById('foodBox');
        box.innerHTML = "";
        const types = ['🧬', '🫘']; 
        for(let i=0; i<18; i++) {
            let t = types[Math.floor(Math.random() * types.length)];
            let s = document.createElement('span');
            s.className = 'item'; s.innerHTML = t;
            s.style.left = Math.random() * 85 + 5 + "%";
            s.style.top = Math.random() * 75 + 5 + "%";
            if(t === '🫘') {
                s.onclick = function() {
                    beep(600, 0.1); this.style.transform = "scale(0)";
                    setTimeout(() => this.remove(), 200);
                };
            }
            box.appendChild(s);
        }
    }

    function catchIron(e) {
        const magnet = document.getElementById('magnet');
        const areaRect = document.getElementById('sandArea').getBoundingClientRect();
        let mx = e.clientX - areaRect.left;
        let my = e.clientY - areaRect.top;

        // تحريك المغناطيس
        magnet.style.left = mx + "px";
        magnet.style.top = my + "px";

        // جذب الحديد
        const bits = document.querySelectorAll('.iron');
        bits.forEach(bit => {
            let bx = bit.offsetLeft + 6;
            let by = bit.offsetTop + 6;
            let dist = Math.sqrt(Math.pow(mx - bx, 2) + Math.pow(my - by, 2));

            // إذا اقترب المغناطيس جداً أو تم صيده سابقاً
            if (dist < 50 || bit.dataset.caught === "true") {
                if (bit.dataset.caught === "false") {
                    beep(1000, 0.02); // صوت طقة الجذب
                    bit.dataset.caught = "true";
                }
                // الحديد يتبع المغناطيس بدقة 100%
                bit.style.left = (mx - 6) + "px";
                bit.style.top = (my + 25) + "px"; // يلتصق أسفل المغناطيس
            }
        });
    }

    function resetLab() {
        if(audioCtx) beep(300, 0.2);
        createItems();
        document.getElementById('status').innerText = "تمت الإعادة! جربي سحب المغناطيس الآن.";
    }

    createItems();
</script>
</body>
</html>
