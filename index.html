<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مختبر العلوم المطور 🔬</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #eceff1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .lab-card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center; width: 700px; border: 10px solid #546e7a; }
        
        /* عناوين واضحة جداً */
        .box-title { background: #4caf50; color: white; padding: 10px; border-radius: 10px; margin: 15px 0; font-size: 20px; font-weight: bold; }
        .box-title.magnet-title { background: #795548; }

        /* منطقة الفاصوليا والصحن */
        .manual-container { display: flex; justify-content: space-around; align-items: center; background: #f1f8e9; padding: 20px; border-radius: 20px; border: 2px solid #c5e1a5; margin-bottom: 30px; }
        .source-area { position: relative; width: 350px; height: 180px; background: white; border: 3px dashed #ff9800; border-radius: 15px; overflow: hidden; }
        .bowl-area { width: 160px; height: 160px; background: #ffffff; border: 6px solid #4caf50; border-radius: 50%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        .bowl-tag { position: absolute; top: -30px; color: #2e7d32; font-weight: bold; }

        /* منطقة الرمل والمغناطيس */
        .sand-area { position: relative; width: 100%; height: 220px; background: #e1c699; background-image: radial-gradient(#c2a679 10%, transparent 20%); background-size: 8px 8px; border: 4px solid #8d6e63; border-radius: 15px; overflow: hidden; cursor: none; }
        .magnet-tool { font-size: 65px; position: absolute; z-index: 1000; pointer-events: none; transform: translate(-50%, -50%); }
        .iron-piece { position: absolute; width: 10px; height: 10px; background: #000; border-radius: 50%; z-index: 10; }

        .emoji-item { position: absolute; font-size: 35px; cursor: pointer; transition: all 0.4s ease-out; user-select: none; }
        
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 15px; border: none; color: white; font-weight: bold; margin: 10px; }
        .btn-audio { background: #e91e63; width: 100%; }
        .btn-reset { background: #f44336; font-size: 18px; }
        #msg { font-weight: bold; color: #37474f; margin-top: 15px; padding: 10px; background: #cfd8dc; border-radius: 10px; }
    </style>
</head>
<body>

<div class="lab-card">
    <button class="btn-audio" onclick="initAudio()">🔊 اضغطي هنا لتفعيل الصوت أولاً</button>

    <div class="box-title">🏷️ التقاط حبات الفاصولياء باليد</div>
    <div class="manual-container">
        <div class="source-area" id="foodBox"></div>
        <div class="bowl-area" id="mainBowl">
            <div class="bowl-tag">صحن التجميع 🍽️</div>
        </div>
    </div>

    <div class="box-title magnet-title">🧲 فصل برادة الحديد عن الرمل بالمغناطيس</div>
    <div class="sand-area" id="sandBox" onmousemove="runMagnet(event)">
        <div id="magnet" class="magnet-tool">🧲</div>
    </div>

    <button class="btn-reset" onclick="resetAll()">🔄 إعادة المحاولة من جديد</button>
    <div id="msg">مرحباً معلمتي! فعلي الصوت ثم ابدئي التجربة.</div>
</div>

<script>
    let audioCtx;
    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        beep(440, 0.2);
        document.getElementById('msg').innerText = "تم تفعيل الصوت! ✅";
    }

    function beep(freq, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq; osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }

    function setupLab() {
        // تجهيز الفاصوليا والمعكرونة
        const foodBox = document.getElementById('foodBox');
        foodBox.innerHTML = "";
        const bowl = document.getElementById('mainBowl');
        bowl.innerHTML = '<div class="bowl-tag">صحن التجميع 🍽️</div>';
        
        const items = ['🧬', '🫘']; 
        for(let i=0; i<18; i++) {
            let type = items[Math.floor(Math.random() * items.length)];
            let span = document.createElement('span');
            span.className = 'emoji-item'; span.innerHTML = type;
            span.style.left = Math.random() * 85 + 5 + "%";
            span.style.top = Math.random() * 75 + 5 + "%";
            
            if(type === '🫘') {
                span.onclick = function() {
                    beep(600, 0.1);
                    this.style.left = "130%"; 
                    this.style.top = "20%";
                    setTimeout(() => {
                        this.style.position = "static";
                        this.style.fontSize = "25px";
                        this.style.margin = "3px";
                        bowl.appendChild(this);
                    }, 400);
                };
            }
            foodBox.appendChild(span);
        }

        // تجهيز الحديد
        const sand = document.getElementById('sandBox');
        document.querySelectorAll('.iron-piece').forEach(i => i.remove());
        for(let i=0; i<35; i++) {
            let iron = document.createElement('div');
            iron.className = 'iron-piece';
            iron.dataset.caught = "false";
            iron.style.left = (Math.random() * 90 + 5) + "%";
            iron.style.top = (Math.random() * 70 + 20) + "%";
            sand.appendChild(iron);
        }
    }

    function runMagnet(e) {
        const magnet = document.getElementById('magnet');
        const area = document.getElementById('sandBox').getBoundingClientRect();
        let mx = e.clientX - area.left;
        let my = e.clientY - area.top;
        magnet.style.left = mx + "px"; magnet.style.top = my + "px";

        const pieces = document.querySelectorAll('.iron-piece');
        pieces.forEach((p, idx) => {
            let px = p.offsetLeft + 5;
            let py = p.offsetTop + 5;
            let dist = Math.sqrt(Math.pow(mx - px, 2) + Math.pow(my - py, 2));

            if (dist < 60 || p.dataset.caught === "true") {
                if (p.dataset.caught === "false") {
                    beep(900, 0.02);
                    p.dataset.caught = "true";
                }
                // الالتصاق بقطبي المغناطيس
                let side = (idx % 2 === 0) ? -18 : 18;
                p.style.left = (mx + side + (Math.random()*8 - 4)) + "px";
                p.style.top = (my + 28 + (Math.random()*10)) + "px";
            }
        });
    }

    function resetAll() {
        if(audioCtx) beep(300, 0.2);
        setupLab();
        document.getElementById('msg').innerText = "تمت إعادة المختبر! جربي مجدداً 🔄";
    }

    setupLab();
</script>
</body>
</html>
