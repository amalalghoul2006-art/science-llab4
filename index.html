<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مختبر الفصل الذكي 🔬</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #eceff1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .lab-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; width: 550px; border: 5px solid #795548; }
        
        .sand-box { 
            position: relative; height: 200px; width: 100%; margin: 15px 0; 
            background: #edc9af; 
            background-image: radial-gradient(#d2b48c 15%, transparent 20%);
            background-size: 8px 8px;
            border-radius: 15px; border: 3px solid #bc8f8f; overflow: hidden; cursor: none;
        }
        .magnet { font-size: 60px; position: absolute; z-index: 100; pointer-events: none; transform: translate(-50%, -50%); transition: transform 0.05s linear; }
        .iron { position: absolute; width: 12px; height: 12px; background: #212121; border-radius: 50%; transition: all 0.2s ease-out; box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        .food-area { position: relative; height: 180px; width: 100%; margin: 15px 0; background: #fff; border-radius: 15px; border: 2px dashed #ff9800; overflow: hidden; }
        .item { position: absolute; font-size: 35px; cursor: pointer; transition: 0.3s; user-select: none; }

        button { padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 15px; border: none; color: white; font-weight: bold; margin: 5px; }
        .btn-audio { background: #e91e63; width: 100%; }
        .btn-reset { background: #f44336; }
        #status { font-weight: bold; color: #5d4037; background: #efebe9; padding: 10px; border-radius: 10px; margin-top: 10px; min-height: 45px; }
    </style>
</head>
<body>

<div class="lab-card">
    <h1>🔬 مختبر فصل المواد الصلبة</h1>
    <button class="btn-audio" onclick="initAudio()">🔊 اضغطي هنا لتفعيل الصوت أولاً</button>

    <p>1. حركي المغناطيس 🧲 فوق الرمل لجذب الحديد:</p>
    <div class="sand-box" id="sandArea" onmousemove="handleMagnet(event)">
        <div id="magnet" class="magnet">🧲</div>
    </div>

    <hr>

    <p>2. انقري على الفاصوليا 🫘 لفصلها عن المعكرونة 🧬:</p>
    <div class="food-area" id="foodBox"></div>

    <button class="btn-reset" onclick="resetLab()">🔄 إعادة التجربة</button>
    <div id="status">جاهزة؟ فعلي الصوت وابدأي الفصل!</div>
</div>

<script>
    let audioCtx;
    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        beep(440, 0.2);
        document.getElementById('status').innerText = "تم تفعيل الصوت! ✅";
    }

    function beep(freq, duration) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq; osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }

    function createIron() {
        const area = document.getElementById('sandArea');
        document.querySelectorAll('.iron').forEach(i => i.remove());
        for(let i=0; i<20; i++) {
            let bit = document.createElement('div');
            bit.className = 'iron';
            bit.style.left = Math.random() * 90 + 5 + "%";
            bit.style.top = Math.random() * 80 + 10 + "%";
            area.appendChild(bit);
        }
    }

    function handleMagnet(e) {
        const magnet = document.getElementById('magnet');
        const areaRect = document.getElementById('sandArea').getBoundingClientRect();
        
        // إحداثيات المغناطيس (مركز المغناطيس تحت الماوس تماماً)
        let x = e.clientX - areaRect.left;
        let y = e.clientY - areaRect.top;
        
        magnet.style.left = x + "px";
        magnet.style.top = y + "px";

        // قوة الجذب (تمت زيادتها)
        const bits = document.querySelectorAll('.iron');
        bits.forEach(bit => {
            let bx = bit.offsetLeft + 6;
            let by = bit.offsetTop + 6;
            let dist = Math.sqrt(Math.pow(x - bx, 2) + Math.pow(y - by, 2));
            
            if(dist < 70) { // منطقة الجذب واسعة
                // الحديد ينجذب ويلتصق بأسفل المغناطيس
                bit.style.left = (x - 5 + (Math.random()*10 - 5)) + "px";
                bit.style.top = (y + 20 + (Math.random()*10 - 5)) + "px";
                if(Math.random() > 0.96) beep(900, 0.03); 
            }
        });
    }

    function createFood() {
        const box = document.getElementById('foodBox');
        box.innerHTML = "";
        const items = ['🧬', '🫘']; 
        for(let i=0; i<18; i++) {
            let type = items[Math.floor(Math.random() * items.length)];
            let span = document.createElement('span');
            span.className = 'item';
            span.innerHTML = type;
            span.style.left = Math.random() * 85 + 5 + "%";
            span.style.top = Math.random() * 75 + 5 + "%";
            span.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            if(type === '🫘') {
                span.onclick = function() {
                    beep(600, 0.1);
                    this.style.transform = "scale(0)";
                    setTimeout(() => this.remove(), 200);
                    document.getElementById('status').innerText = "رائع! فصلتِ حبة فاصوليا 🫘";
                };
            }
            box.appendChild(span);
        }
    }

    function resetLab() {
        if(audioCtx) beep(300, 0.2);
        createIron();
        createFood();
        document.getElementById('status').innerText = "تمت إعادة ترتيب المخلوط! 🔄";
    }

    createIron();
    createFood();
</script>

</body>
</html>
